name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches the plugin header
        run: |
          header=$(grep -m1 -E '^ \* Version:' simple-mega-menu.php | awk '{print $NF}')
          if [ "v$header" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin header version $header"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm run plugin-zip

      - name: Extract release notes from CHANGELOG.md
        run: node bin/release.mjs notes "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" simple-mega-menu.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" simple-mega-menu.zip --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
